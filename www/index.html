<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b23c17">
<title>BellForge Kettlebell App</title>
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
:root{
  /* Layout: app shell. Left rail on desktop, bottom tab bar on phones; one scrolling column of panels.
     Level colours follow competition kettlebell weights: 12 kg blue, 16 kg yellow, 24 kg green. */
  --bg:#f1efeb; --surface:#ffffff; --surface-2:#f7f5f1; --ink:#1c1b19; --muted:#69645c; --line:#dfdad1;
  --accent:#b23c17; --accent-ink:#ffffff; --accent-soft:#f6e3db;
  --lv1:#2461c7; --lv2:#b98c00; --lv3:#22834a; --good:#22834a; --warn:#a86a12; --bad:#bf3328;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --surface:#1c1b19; --surface-2:#242220; --ink:#f0ece6; --muted:#a39d94; --line:#34312d;
    --accent:#f07443; --accent-ink:#1b0d06; --accent-soft:#3a2219;
    --lv1:#6197f0; --lv2:#e6bd34; --lv3:#4bb873; --good:#4bb873; --warn:#e0a346; --bad:#ee6b5f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1c1b19; --surface-2:#242220; --ink:#f0ece6; --muted:#a39d94; --line:#34312d;
  --accent:#f07443; --accent-ink:#1b0d06; --accent-soft:#3a2219;
  --lv1:#6197f0; --lv2:#e6bd34; --lv3:#4bb873; --good:#4bb873; --warn:#e0a346; --bad:#ee6b5f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand svg{flex:none;display:block}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand b{font-family:var(--display);font-size:23px;text-transform:uppercase;letter-spacing:.02em}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .foot{margin-top:auto;padding:8px;font-size:12px;color:var(--muted)}
main{padding:calc(28px + env(safe-area-inset-top)) max(clamp(16px,3vw,40px), env(safe-area-inset-right)) 60px max(clamp(16px,3vw,40px), env(safe-area-inset-left));max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head .sub{color:var(--muted);margin-top:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.lvchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.lv1{--c:var(--lv1)} .lv2{--c:var(--lv2)} .lv3{--c:var(--lv3)}
.pill-good{color:var(--good)} .pill-warn{color:var(--warn)}

.tile{padding:16px 18px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:42px;font-weight:700;line-height:1;margin-top:6px}
.tile .v small{font-size:18px;color:var(--muted);font-weight:600}

/* exercise images */
.pic{position:relative;background:#f5f4f1;border-radius:8px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.noimg::after{content:"Image coming soon";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#69645c}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mus span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.mus .p{background:#e4572e;border-color:#e4572e;color:#fff}
.mus .s{background:#f7b955;border-color:#f7b955;color:#3b2604}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* programs */
.pcard{display:grid;grid-template-columns:1fr;gap:10px}
.wkgrid{display:grid;gap:10px}
.wk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.slot{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.tick.next{border-color:var(--accent)}
/* challenge library */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tcard h3{font-size:18px}
.tcard .btn{margin-top:auto;align-self:flex-start}
.teamtot{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
select,input[type=text],input[type=number],input[type=email]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
input[type=text].search{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label.f > select,label.f > input{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}

/* workout cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.wcard{position:relative;display:grid;grid-template-columns:1fr;gap:10px;padding:12px 12px 14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.wcard .thumb{border-radius:8px}
.wcard h3{font-size:20px}
.wcard .meta{font-size:12.5px;color:var(--muted)}
.wcard .moves{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .acts{grid-column:1/-1;display:flex;gap:8px}
.wcard .acts .btn{flex:1}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}

/* figure */
.fig svg{display:block;width:100%;height:100%}
.fig{width:100%;height:100%}

/* detail */
.dhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts b{font-family:var(--display);font-size:22px}
.exlist{display:grid;gap:14px;margin-top:18px}
.exrow{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:18px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.exrow .stage{border-radius:8px}
.exrow .rx{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent)}
.exrow ul{margin:6px 0 0;padding-left:18px}
.exrow li{margin:2px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}
.lbl.bad{color:var(--bad)}

/* timer */
.timer{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
.ringwrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tdig{font-family:var(--display);font-size:clamp(56px,9vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tphase{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:4px}
.tphase.work{color:var(--accent)} .tphase.rest{color:var(--good)}
.tstage{display:grid;grid-template-columns:1fr;gap:14px}
.tstage .stage{border-radius:8px;max-width:560px}
.steps{max-height:340px;overflow:auto;border-top:1px solid var(--line);margin-top:12px}
.steps div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.steps div.cur{background:var(--accent-soft);font-weight:600}
.steps div.done{color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* challenges */
.lb{display:grid;gap:6px}
.lbrow{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px}
.lbrow.me{background:var(--accent-soft)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.lbrow.me .av{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rank{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.week i{width:100%;max-width:36px;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.week i.today{outline:2px solid var(--ink);outline-offset:1px}
.feed{display:grid;gap:0}
.feed div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:12px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow-wrap:anywhere}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;background:var(--surface)}

/* meals */
.plan{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:70px repeat(var(--n),1fr) 120px;gap:6px;align-items:stretch}
.prow .day{font-family:var(--display);font-size:18px;font-weight:700;display:flex;align-items:center}
.meal{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:13px;min-height:74px}
.meal:hover{border-color:var(--accent)}
.meal b{font-weight:600;line-height:1.25}
.meal .slot{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.meal .mac{font-size:11.5px;color:var(--muted);margin-top:auto}
.dtot{font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 4px}
.phead{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sumtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.sumtbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.sumtbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sumtbl tr.tot td{font-weight:700;font-size:16px;border-bottom:0}
pre.payload{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;max-height:260px;overflow:auto;margin:0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;text-align:center}
  .timer{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr;border-bottom:1px solid var(--line);padding-bottom:10px}
  .prow.hdr{display:none}
  .dtot{flex-direction:row;flex-wrap:wrap}
}
@media (max-width:560px){
  h1{font-size:28px}
  .exrow{grid-template-columns:1fr}
  .cols2{grid-template-columns:1fr}
  .dhead{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 12 Q10 3 16 3 Q22 3 22 12" style="fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round"/><circle cx="16" cy="20" r="10" style="fill:var(--accent)"/></svg><b>BellForge</b></div>
    <div id="railnav" class="stack" style="gap:4px"></div>
    <div class="foot">Beta. Friends, invites and meal delivery are simulated. <button class="btn ghost sm" data-act="reset" style="padding:4px 0">Reset demo data</button></div>
  </nav>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){ let a = seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fromIso = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const mmss = s => { s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const money = n => '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }catch(e){ toast('Copy was blocked. Select the text and copy it manually.'); } }

/* ---------- stick-figure poses (side view, facing right, ground y=200) ---------- */
const POSES = {
  STAND:{s:[100,64],p:[100,116],k1:[103,157],a1:[101,197],k2:[97,157],a2:[97,197]},
  HINGE_HIGH:{s:[124,92],p:[80,118],h:[15,-13],k1:[100,154],a1:[98,197],k2:[96,154],a2:[94,197]},
  HINGE_LOW:{s:[122,108],p:[76,124],h:[16,-9],k1:[102,156],a1:[98,197],k2:[98,156],a2:[94,197]},
  SQUAT:{s:[96,108],p:[78,150],h:[4,-21],k1:[116,150],a1:[104,197],k2:[112,152],a2:[100,197]},
  SQUAT_DIP:{s:[100,74],p:[97,126],k1:[110,162],a1:[101,197],k2:[106,162],a2:[97,197]},

function buildWorkouts(){
  const out=[]; const seen={};
  for(let i=0;i<300;i++){
    const bw=i>=200, j=i-200;
    const r=rng(9001+i*7919); const lv=bw?(j<35?1:j<70?2:3):(i<70?1:i<140?2:3);
    const fmt = weighted(r, (lv===1||bw)?{circuit:40,emom:20,ladder:15,tabata:10,amrap:15}:{circuit:30,emom:18,ladder:12,tabata:10,amrap:15,complex:15});
    let pool = EX.filter(e=>e.lv<=lv && !!e.bw===bw && !(lv===1 && e.dbl));
    if(fmt==='tabata') pool=pool.filter(e=>!e.noFast);
    if(fmt==='complex') pool=pool.filter(e=>!e.dbl && e.unit!=='sec');
    const n = fmt==='tabata'||fmt==='emom' ? 2+Math.floor(r()*3) : 3+Math.floor(r()*3);
    const chosen=[];
    if(lv>1){ const top=pool.filter(e=>e.lv===lv); if(top.length) chosen.push(pick(r,top)); }
    let guard=0; while(chosen.length<n && guard++<60){ const e=pick(r,pool); if(!chosen.includes(e)) chosen.push(e); }
    const base = [0,8,10,12][lv] + Math.floor(r()*3);
    const items = chosen.map(e=>{
      if(e.unit==='sec') return {ex:e.id, secs:Math.min(e.maxSec||99,[0,20,30,40][lv])};
      let reps = Math.max(1,Math.round((fmt==='emom'?base-3:fmt==='complex'?Math.round(base*0.6):base)*(e.scale||1)));
      return {ex:e.id, reps};
    });
    const w={id:i+1, bw, code:(bw?'BW-'+String(j+1):'KB-'+String(i+1)).padStart(bw?7:7,'0').replace(/^0+/,'') , lv, fmt, items};
    w.code = bw?'BW-'+String(j+1).padStart(4,'0'):'KB-'+String(i+1).padStart(4,'0');
    if(fmt==='circuit'){ w.rounds=[0,3,4,5][lv]-(r()<.3?1:0); w.restEx=[0,20,15,10][lv]; w.restRound=[0,60,60,45][lv]; }
    if(fmt==='emom'){ w.rounds=3+Math.floor(r()*3)+(lv-1); w.minutes=w.rounds*items.length; }
    if(fmt==='amrap'){ w.minutes=pick(r,[[0],[10,12,15],[12,15,20],[15,20,25]][lv]); }
    if(fmt==='ladder'){ w.rungs=[[],[2,4,6,8],[2,4,6,8,10],[3,6,9,12,15]][lv]; w.restRound=[0,45,40,30][lv]; }
    if(fmt==='tabata'){ w.restRound=60; }
    if(fmt==='complex'){ w.rounds=[0,3,4,5][lv]; w.restRound=90; }
    const foci={}; chosen.forEach(e=>foci[e.focus]=(foci[e.focus]||0)+1);
    const top=Object.entries(foci).sort((a,b)=>b[1]-a[1]);
    w.focus = (Object.keys(foci).length>=3 && top[0][1]<2) ? 'Full body' : top[0][0];
    w.equip = bw ? 'Bodyweight' : chosen.some(e=>e.dbl) ? 'Double bells' : 'Single bell';
    w.gear = [...new Set(chosen.map(e=>e.gear).filter(Boolean))];
    let nm = pick(r,bw?BWA:WA)+' '+pick(r,WB); seen[nm]=(seen[nm]||0)+1; w.name = nm + (seen[nm]<ROMAN.length ? ROMAN[seen[nm]] : ' '+seen[nm]);

    w.secs = w.steps.reduce((a,s)=>a+s.secs,0) - 10;
    w.dur = Math.max(5,Math.round(w.secs/60));
    out.push(w);
  }
  return out;
}
function workSecs(ex,item,repsOverride){

function rxText(ex,item,w){

function buildSteps(w){
  const S=[{k:'ready',secs:10,label:'Get ready',ex:w.items[0].ex}];
  const work=(item,reps,round)=>{ const ex=EXM[item.ex]; const rr=(reps!=null?reps:item.reps); const tgt = item.secs? item.secs+'s'+(ex.sided?' / side':'') : rr+(rr===1?' rep':' reps')+(ex.sided?' / side':''); S.push({k:'work',ex:item.ex,secs:workSecs(ex,item,reps),label:ex.name,target:tgt,round}); };

    for(let r=1;r<=w.rounds;r++){ it.forEach((item,j)=>{ work(item,null,r); if(j<it.length-1 && w.fmt==='circuit') rest(w.restEx,it[j+1].ex); }); if(r<w.rounds) rest(w.restRound,it[0].ex,'Round rest'); }

    w.rungs.forEach((rung,ri)=>{ it.forEach(item=>{ const ex=EXM[item.ex]; work(item, item.secs?null:Math.max(1,Math.round(rung*(ex.scale||1))), ri+1); }); if(ri<w.rungs.length-1) rest(w.restRound,it[0].ex,'Rung rest'); });

}

function resolve(ex,[pn,x1,x2]){

  const html=VIEWS.map(([k,l])=>`<button class="navbtn" data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></button>`).join('');
  $('#railnav').innerHTML=html; $('#tabbar').innerHTML=html;
}
function route(){
  const h=(location.hash||'').slice(1);
  let view='today', detail=null, prog=null;
  if(/^w-\d{1,4}$/.test(h)){ view='workouts'; detail=+h.slice(2); if(!W(detail)) detail=null; }
  else if(/^p-p\d+$/.test(h) && PM[h.slice(2)]){ view='programs'; prog=PM[h.slice(2)]; }
  else if(VIEWS.some(v=>v[0]===h)) view=h;
  renderNav(view);
  const main=$('#main');
  main.innerHTML = view==='today'?vToday(): view==='workouts'?(detail?vDetail(W(detail)):vWorkouts()): view==='programs'?(prog?vProgram(prog):vPrograms()): view==='timer'?vTimer(): view==='challenges'?vChallenges(): vMeals();
  if(view==='workouts' && !detail) renderList();
  mountAll(main);
  if(view==='timer') updateTimerUI();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function filtered(){
  const F=UI.filters, q=F.q.trim().toLowerCase();
  return WORKOUTS.filter(w=>{
    if(!!w.bw!==(F.mode==='bw')) return false;
    if(F.lv && w.lv!==F.lv) return false;
    if(F.focus && w.focus!==F.focus) return false;
    if(F.fmt && w.fmt!==F.fmt) return false;
    if(F.equip && w.equip!==F.equip) return false;
    if(F.saved && !S.saved.includes(w.id)) return false;
    if(F.dur){ const d=w.dur; if(F.dur==='s'&&d>15) return false; if(F.dur==='m'&&(d<16||d>25)) return false; if(F.dur==='l'&&(d<26||d>40)) return false; if(F.dur==='x'&&d<=40) return false; }
    if(q){ const hay=(w.name+' '+w.code+' '+w.items.map(i=>EXM[i.ex].name).join(' ')+' '+FMT[w.fmt].name).toLowerCase(); if(!q.split(/\s+/).every(t=>hay.includes(t))) return false; }
    return true;
  });
}

/* ---------- Timer ---------- */
const T={steps:[],i:0,left:0,running:false,last:0,wid:null,title:'',elapsed:0,rounds:0,done:false,iv:null,beepAt:null,amrapIdx:0};
let AC=null;
function beep(f,d){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=f; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
function loadTimer(steps,wid,title){ stopTimer(); Object.assign(T,{prog:null,wobj:null,steps,i:0,left:steps[0].secs,wid,title,elapsed:0,rounds:0,done:false,beepAt:null,amrapIdx:0}); }
function stopTimer(){ T.running=false; clearInterval(T.iv); T.iv=null; }
function startTimer(){ if(T.done||!T.steps.length) return; T.running=true; T.last=performance.now(); clearInterval(T.iv); T.iv=setInterval(tick,200); beep(660,.12); }
function goStep(i){ T.i=i; T.left=T.steps[i].secs; T.beepAt=null; T.amrapIdx=0; renderTimerStage(); }
function tick(){
  const now=performance.now(), dt=(now-T.last)/1000; T.last=now; T.left-=dt; T.elapsed+=dt;
  const sec=Math.ceil(T.left);
  if(sec<=3 && sec>0 && T.beepAt!==sec){ T.beepAt=sec; beep(520,.09); }
  const st=T.steps[T.i];
  if(st.k==='amrap'){ const w=T.wobj||W(T.wid); if(w){ const idx=Math.floor((st.secs-T.left)/8)%w.items.length; if(idx!==T.amrapIdx){ T.amrapIdx=idx; renderTimerStage(); } } }
  if(T.left<=0){ if(T.i<T.steps.length-1){ beep(880,.2); goStep(T.i+1); } else { finish(); return; } }
  updateTimerUI();
}
function finish(){
  stopTimer(); T.done=true; beep(990,.35);
  const min=Math.max(1,Math.round(T.elapsed/60));
  S.history.push({d:iso(TODAY),id:T.wid||0,min,name:T.title});
  if(T.prog && S.enrolled[T.prog.pid] && !S.enrolled[T.prog.pid].done.includes(T.prog.k)) S.enrolled[T.prog.pid].done.push(T.prog.k);
  S.feed.unshift({t:Date.now(),txt:`You finished ${T.title} (${min} min)`});
  save(); route(); toast('Session logged. Your streak and contests are updated.');
}

        </div>
        <button class="btn pri" type="submit">Load custom timer</button>
      </form>
    </div>`;
  }
  return `<div class="head"><div><h1>${esc(T.title)}</h1><p class="sub">${T.wid?W(T.wid).code+' · ':''}${T.steps.length} steps · about ${Math.round((T.steps.reduce((a,s)=>a+s.secs,0))/60)} min</p></div>
    <button class="btn sm" data-act="tclear">Close session</button></div>
  <div class="timer">
    <div class="panel">
      <div class="ringwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle id="tring" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"/></svg>
        <div class="inner"><div class="tdig" id="tdig">0:00</div><div class="tphase" id="tphase"></div><div class="small muted num" id="telapsed"></div></div></div>
      <div class="row" style="justify-content:center;margin-top:14px">

function renderTimerStage(){
  const box=$('#tstage'); if(!box) return;
  const st=T.steps[T.i]; const w=T.wobj||(T.wid?W(T.wid):null);
  if(T.done){ box.innerHTML=`<h2>Session complete</h2><p class="muted" style="margin-top:6px">${Math.max(1,Math.round(T.elapsed/60))} minutes logged. Streak: ${streak()} days.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-act="nav" data-v="challenges">See the leaderboard</button><button class="btn" data-act="treset">Do it again</button></div>`; renderSteps(); return; }
  let exId=st.ex, head='', sub='';
  if(st.k==='amrap' && w){ exId=w.items[T.amrapIdx].ex; head=st.label; sub=`Rounds logged: <b class="num" id="trounds">${T.rounds}</b>`; }
  else if(st.k==='rest'){ head=st.label; sub='Up next: '+esc(EXM[st.ex].name); }
  else if(st.k==='ready'){ head='Get ready'; sub='First up: '+esc(EXM[st.ex].name); }
  else { head=esc(st.label); sub=esc(st.target||'')+(st.round?` · ${w&&w.fmt==='emom'?'minute':w&&w.fmt==='ladder'?'rung':'round'} ${st.round}`:''); }
  const ex=EXM[exId];
  box.innerHTML=`<div class="tstage"><div class="stage">${pic(exId)}</div>
    <div><div class="lbl">${st.k==='rest'?'Rest':st.k==='ready'?'Starting':'Now'}</div><h2 style="margin-top:4px">${head}</h2><p style="margin-top:6px">${sub}</p>
    ${st.k==='amrap'&&w?`<ul class="small" style="margin:8px 0 0;padding-left:18px">${w.items.map((it,i)=>`<li ${i===T.amrapIdx?'style="font-weight:600"':''}>${esc(EXM[it.ex].name)}: ${rxText(EXM[it.ex],it,w)}</li>`).join('')}</ul><button class="btn sm pri" data-act="tround" style="margin-top:10px">+1 round</button>`
      :`<ul class="small muted" style="margin:8px 0 0;padding-left:18px">${ex.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`}
    </div></div>`;
  mountAll(box); renderSteps();
}
function renderSteps(){
  const box=$('#tsteps'); if(!box) return;
  box.innerHTML=T.steps.map((s,i)=>`<div class="${i<T.i||T.done?'done':''} ${i===T.i&&!T.done?'cur':''}"><span class="num muted">${i+1}</span><span>${s.k==='rest'?esc(s.label):s.k==='ready'?'Get ready':esc(s.label)+(s.target?' · '+esc(s.target):'')}</span><span class="num">${mmss(s.secs)}</span></div>`).join('');
  const cur=box.querySelector('.cur'); if(cur) box.scrollTop=cur.offsetTop-box.offsetTop-60;
}
function updateTimerUI(){
  const d=$('#tdig'); if(!d) return;
  if(!$('#tstage').innerHTML) renderTimerStage();
  const st=T.steps[T.i];
  d.textContent=T.done?'Done':mmss(T.left);
  const ph=$('#tphase'); ph.textContent=T.done?'Logged':st.k==='rest'?'Rest':st.k==='ready'?'Get ready':st.k==='amrap'?'AMRAP':'Work';
  ph.className='tphase '+(st.k==='rest'?'rest':st.k==='ready'?'':'work');
  $('#tring').setAttribute('stroke-dashoffset',(552.9*(1-Math.max(0,T.left)/st.secs)).toFixed(1));
  $('#tring').setAttribute('stroke',st.k==='rest'?'var(--good)':'var(--accent)');
  $('#telapsed').textContent='Elapsed '+mmss(T.elapsed);
  $('#ttoggle').textContent=T.done?'Done':T.running?'Pause':(T.elapsed>0?'Resume':'Start');
  const total=T.steps.reduce((a,s)=>a+s.secs,0), passed=T.steps.slice(0,T.i).reduce((a,s)=>a+s.secs,0)+(st.secs-Math.max(0,T.left));
  $('#tprog').style.width=(T.done?100:passed/total*100).toFixed(1)+'%';
}

function targets(){ const m=S.meal; const kg=m.lbs*0.4536, cm=(m.ft*12+ +m.inch)*2.54; const bmr=10*kg+6.25*cm-5*m.age+(m.sex==='M'?5:-161); const tdee=bmr*m.act; const kcal=Math.round(tdee*(m.goal==='lose'?0.8:m.goal==='build'?1.1:1)/10)*10; const protein=Math.round(m.lbs*(m.goal==='build'?1:0.8)); return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein}; }
function eligible(slot){ const m=S.meal; const ok=DIETS[m.diet][1]; return MEALS.filter(x=>x.slot===slot && ok.includes(x.type) && !x.al.some(a=>m.allergens.includes(a))); }
function genPlan(){ const slots=SLOTS[S.meal.mpd]; S.meal.plan=DAYS.map((_,d)=>slots.map((s,si)=>{ const el=eligible(s); return el.length? el[(d*(si+2)+si)%el.length].id : null; })); }
function portionFactor(){ const m=S.meal; if(m.portion==='regular') return 1; if(m.portion==='large') return 1.3; const t=targets().kcal; const avg=planDayTotals(1).reduce((a,d)=>a+d.kcal,0)/7; return avg && Math.abs(avg*1.3-t)<Math.abs(avg-t) ? 1.3 : 1; }
function planDayTotals(pf){ return S.meal.plan.map(day=>day.reduce((a,id)=>{ const x=MM[id]; if(!x) return a; return {kcal:a.kcal+x.kcal*pf,p:a.p+x.p*pf,c:a.c+x.c*pf,f:a.f+x.f*pf}; },{kcal:0,p:0,c:0,f:0})); }
function orderLines(){
  const slots=SLOTS[S.meal.mpd]; const pf=portionFactor(); const q={};
  S.meal.plan.forEach(day=>day.forEach((id,si)=>{ if(id && S.meal.deliver[slots[si]]) q[id]=(q[id]||0)+4; }));
  const lines=Object.entries(q).map(([id,qty])=>{ const m=MM[id]; const unit=m.price+(pf>1?3:0); return {id,name:m.name,qty,unit,amt:unit*qty}; }).sort((a,b)=>b.qty-a.qty);
  const count=lines.reduce((a,l)=>a+l.qty,0), sub=lines.reduce((a,l)=>a+l.amt,0), disc=sub*0.1;
  return {lines,count,sub,disc,total:sub-disc,pf};
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pref){ S.prefs[t.dataset.pref]=t.checked; save(); route(); toast(t.checked?'Pull-ups unlocked':'Pull-ups will be swapped for table rows'); return; }
  if(t.dataset.ch==='goal'){ S.prefs.goal=+t.value; save(); route(); return; }
  if(t.dataset.ch){ UI.filters[t.dataset.ch]=t.value; UI.filters.limit=24; renderList(); return; }
  if(t.dataset.m){ const k=t.dataset.m; const num=['age','lbs','ft','inch','act','mpd','day'].includes(k); let v=num?+t.value:t.value; if(num && !isFinite(v)) return;
    S.meal[k]=v; if(['diet','mpd'].includes(k)) genPlan(); save(); route(); return; }
  if(t.dataset.al){ const a=t.dataset.al; const L=S.meal.allergens; const i=L.indexOf(a); if(t.checked&&i<0) L.push(a); if(!t.checked&&i>=0) L.splice(i,1); genPlan(); save(); route(); return; }
  if(t.dataset.dl){ S.meal.deliver[t.dataset.dl]=t.checked; save(); route(); return; }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  if(f==='custom'){ const ex=$('#cx-ex').value, w=Math.max(5,+$('#cx-w').value||40), r=Math.max(0,+$('#cx-r').value||0), n=Math.min(50,Math.max(1,+$('#cx-n').value||8));
    const steps=[{k:'ready',secs:10,label:'Get ready',ex}]; for(let i=1;i<=n;i++){ steps.push({k:'work',ex,secs:w,label:EXM[ex].name,target:w+'s work',round:i}); if(i<n && r) steps.push({k:'rest',secs:r,label:'Rest',ex}); }
    loadTimer(steps,null,`Custom: ${EXM[ex].name}`); route(); }
  if(f==='contest'){ const name=$('#cn').value.trim(); if(!name) return; const D=UI.contestDraft||{};
    let c;
    const members=[{id:'me'},...[...document.querySelectorAll('input[name="cf"]:checked')].map(x=>({id:x.value,st:'invited'}))];
    const code=Math.random().toString(36).slice(2,10).toUpperCase();
    if(D.tpl){ c={id:'c'+Date.now(),name,metric:D.metric,start:iso(TODAY),end:iso(addDays(TODAY,D.days-1)),members,stake:$('#cs').value.trim(),code};
      ['target','moves','lv','fmt','wid'].forEach(k=>{ if(D[k]!=null) c[k]=D[k]; }); }
    else { const days=+$('#cd').value, metric=$('#cm').value, tg=+$('#ct').value;
      c={id:'c'+Date.now(),name,metric,start:iso(TODAY),end:iso(addDays(TODAY,days-1)),members,stake:$('#cs').value.trim(),code};
      if(tg>0) c.target=tg; if(metric==='workout' && D.wid) c.wid=D.wid; }
    S.contests.unshift(c); S.feed.unshift({t:Date.now(),txt:`You started ${name}`}); UI.contestDraft=null; UI.lastInvite=`https://bellforge.example/join/${code}`; save(); route(); toast('Contest created. Share the invite link with your friends.'); }
  if(f==='friend'){ const v=$('#fa').value.trim(); if(!v) return; S.friends.push({id:'u'+Date.now(),name:v.includes('@')?v.split('@')[0]:v,streak:0,mpd:8,spw:3,last:'–',status:'pending'}); save(); route(); toast(`Friend request ready for ${v}`); }
});

route();
})();
</script>
</body>
</html>
