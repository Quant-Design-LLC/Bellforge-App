<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b23c17">
<title>BellForge Kettlebell App</title>
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
:root{
  /* Layout: app shell. Left rail on desktop, bottom tab bar on phones; one scrolling column of panels.
     Level colours follow competition kettlebell weights: 12 kg blue, 16 kg yellow, 24 kg green. */
  --bg:#f1efeb; --surface:#ffffff; --surface-2:#f7f5f1; --ink:#1c1b19; --muted:#69645c; --line:#dfdad1;
  --accent:#b23c17; --accent-ink:#ffffff; --accent-soft:#f6e3db;
  --lv1:#2461c7; --lv2:#b98c00; --lv3:#22834a; --good:#22834a; --warn:#a86a12; --bad:#bf3328;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --surface:#1c1b19; --surface-2:#242220; --ink:#f0ece6; --muted:#a39d94; --line:#34312d;
    --accent:#f07443; --accent-ink:#1b0d06; --accent-soft:#3a2219;
    --lv1:#6197f0; --lv2:#e6bd34; --lv3:#4bb873; --good:#4bb873; --warn:#e0a346; --bad:#ee6b5f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1c1b19; --surface-2:#242220; --ink:#f0ece6; --muted:#a39d94; --line:#34312d;
  --accent:#f07443; --accent-ink:#1b0d06; --accent-soft:#3a2219;
  --lv1:#6197f0; --lv2:#e6bd34; --lv3:#4bb873; --good:#4bb873; --warn:#e0a346; --bad:#ee6b5f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand svg{flex:none;display:block}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand b{font-family:var(--display);font-size:23px;text-transform:uppercase;letter-spacing:.02em}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .foot{margin-top:auto;padding:8px;font-size:12px;color:var(--muted)}
main{padding:calc(28px + env(safe-area-inset-top)) max(clamp(16px,3vw,40px), env(safe-area-inset-right)) 60px max(clamp(16px,3vw,40px), env(safe-area-inset-left));max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head .sub{color:var(--muted);margin-top:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.lvchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.lv1{--c:var(--lv1)} .lv2{--c:var(--lv2)} .lv3{--c:var(--lv3)}
.pill-good{color:var(--good)} .pill-warn{color:var(--warn)}

.tile{padding:16px 18px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:42px;font-weight:700;line-height:1;margin-top:6px}
.tile .v small{font-size:18px;color:var(--muted);font-weight:600}

/* exercise images */
.pic{position:relative;background:#f5f4f1;border-radius:8px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.noimg::after{content:"Image coming soon";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#69645c}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mus span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.mus .p{background:#e4572e;border-color:#e4572e;color:#fff}
.mus .s{background:#f7b955;border-color:#f7b955;color:#3b2604}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* programs */
.pcard{display:grid;grid-template-columns:1fr;gap:10px}
.wkgrid{display:grid;gap:10px}
.wk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.slot{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.tick.next{border-color:var(--accent)}
/* challenge library */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tcard h3{font-size:18px}
.tcard .btn{margin-top:auto;align-self:flex-start}
.teamtot{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
/* setup */
.setup{max-width:560px;margin:4vh auto 0}
.setup h1{font-size:40px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:600}
.opt span{font-weight:400;font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
body.setup-mode .tabbar,body.setup-mode .rail{display:none}
body.setup-mode .app{grid-template-columns:1fr}
/* update banner */
.upd{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 12px 10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 24px);font-size:14px}
/* resume bar */
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.resume b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.resume .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:901px){.resume{bottom:20px}}
/* hero invite */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px}
.hero h2{color:inherit}.hero p{opacity:.92}
.hero .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);font-size:15px;padding:12px 18px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
/* progress charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.chart .bar{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart .hit:focus+.bar{opacity:.8}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
.heat{display:grid;grid-template-columns:28px repeat(var(--cols),1fr);gap:3px;align-items:center}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.heat i.l1{background:color-mix(in oklab,var(--accent) 30%,var(--surface));border-color:transparent}
.heat i.l2{background:color-mix(in oklab,var(--accent) 55%,var(--surface));border-color:transparent}
.heat i.l3{background:color-mix(in oklab,var(--accent) 80%,var(--surface));border-color:transparent}
.heat i.l4{background:var(--accent);border-color:transparent}
.heat i.fut{visibility:hidden}
.heat span{font-size:10.5px;color:var(--muted)}
.hlegend{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);justify-content:flex-end;margin-top:8px}
.hlegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mbar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13.5px;padding:3px 0}
.mbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
/* accounts */
.err{color:var(--bad);font-size:13.5px}
.person{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .av{flex:none}
.person .who{flex:1;min-width:0}
.person .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-family:var(--mono,monospace);font-size:13px;color:var(--muted)}
.uname{display:inline-flex;gap:8px;align-items:center;background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 8px 6px 14px;font-weight:700;margin-top:10px}
.lb{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb.me{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
select,input[type=text],input[type=number],input[type=email],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
input[type=text].search{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label.f > select,label.f > input{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}

/* workout cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.wcard{position:relative;display:grid;grid-template-columns:1fr;gap:10px;padding:12px 12px 14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.wcard .thumb{border-radius:8px}
.wcard h3{font-size:20px}
.wcard .meta{font-size:12.5px;color:var(--muted)}
.wcard .moves{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .acts{grid-column:1/-1;display:flex;gap:8px}
.wcard .acts .btn{flex:1}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}

/* figure */
.fig svg{display:block;width:100%;height:100%}
.fig{width:100%;height:100%}

/* detail */
.dhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts b{font-family:var(--display);font-size:22px}
.exlist{display:grid;gap:14px;margin-top:18px}
.exrow{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:18px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.exrow .stage{border-radius:8px}
.exrow .rx{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent)}
.exrow ul{margin:6px 0 0;padding-left:18px}
.exrow li{margin:2px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}
.lbl.bad{color:var(--bad)}

/* timer */
.timer{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
.ringwrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tdig{font-family:var(--display);font-size:clamp(56px,9vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tphase{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:4px}
.tphase.work{color:var(--accent)} .tphase.rest{color:var(--good)}
.tstage{display:grid;grid-template-columns:1fr;gap:14px}
.tstage .stage{border-radius:8px;max-width:560px}
.steps{max-height:340px;overflow:auto;border-top:1px solid var(--line);margin-top:12px}
.steps div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.steps div.cur{background:var(--accent-soft);font-weight:600}
.steps div.done{color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* challenges */
.lb{display:grid;gap:6px}
.lbrow{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px}
.lbrow.me{background:var(--accent-soft)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.lbrow.me .av{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rank{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.week i{width:100%;max-width:36px;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.week i.today{outline:2px solid var(--ink);outline-offset:1px}
.feed{display:grid;gap:0}
.feed div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:12px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;overflow-wrap:anywhere}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;background:var(--surface)}

/* meals */
.plan{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:70px repeat(var(--n),1fr) 120px;gap:6px;align-items:stretch}
.prow .day{font-family:var(--display);font-size:18px;font-weight:700;display:flex;align-items:center}
.meal{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:13px;min-height:74px}
.meal:hover{border-color:var(--accent)}
.meal b{font-weight:600;line-height:1.25}
.meal .slot{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.meal .mac{font-size:11.5px;color:var(--muted);margin-top:auto}
.dtot{font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 4px}
.phead{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sumtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.sumtbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.sumtbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sumtbl tr.tot td{font-weight:700;font-size:16px;border-bottom:0}

  .prow.hdr{display:none}
  .dtot{flex-direction:row;flex-wrap:wrap}
}
@media (max-width:560px){

}

function authFail(msg){ UI.authBusy=false; UI.authErr=msg; route(); }
async function doAuth(mode){
  if(!sb) return authFail('Accounts are not available right now. Try updating the app.');
  const email=$('#au-email').value.trim(), pass=$('#au-pass').value; const u=mode==='signup'?$('#au-user').value.trim().replace(/^@/,'').toLowerCase():'';
  UI.authEmail=email; UI.authUser=u;
  if(!/^\S+@\S+\.\S+$/.test(email)) return authFail('Enter a valid email address.');
  if(mode==='signup'){ if(!/^[a-z0-9_]{3,20}$/.test(u)) return authFail('Usernames are 3–20 characters: lowercase letters, numbers and _.'); if(pass.length<8) return authFail('Use at least 8 characters for your password.'); }
  else if(!pass) return authFail('Enter your password.');
  UI.authBusy=true; UI.authErr=''; route();
  try{
    if(mode==='signup'){
      const {data:ok,error:ue}=await sb.rpc('username_available',{u}); if(ue) throw ue; if(!ok) return authFail(`@${u} is taken. Try another username.`);
      const {data,error}=await sb.auth.signUp({email,password:pass}); if(error) throw error;
      if(!data.session) return authFail('Your account was created. Confirm it from the email we sent, then sign in.');
      CL.user=data.session.user;
      const {error:pe}=await sb.from('profiles').insert({id:CL.user.id,username:u,display_name:((S.profile&&S.profile.name)||u).slice(0,30),level:S.prefs.level||1});
      if(pe){ UI.authBusy=false; CL.profile=null; CL.loaded=true; route(); return toast(friendlyErr(pe)); }
      S.restoredFor=CL.user.id;
      UI.authBusy=false; UI.authErr=''; UI.authUser=''; await cloudLoad(true); doBackup(); toast(`Welcome, @${u}. Your account is ready.`);
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error;
      CL.user=data.user; UI.authBusy=false; UI.authErr=''; await cloudLoad(true); toast('Signed in');
    }
  }catch(e){ authFail(friendlyErr(e)); }
}
async function addFriend(raw){
  const name=raw.trim().replace(/^@/,'').toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(name)) return toast('Enter a username, like mike_swings');
  if(name===CL.profile.username) return toast("That's your own username");
  const {data:p,error}=await sb.from('profiles').select('id,username,display_name').eq('username',name).maybeSingle();
  if(error) return toast(friendlyErr(error)); if(!p) return toast(`No one has the username @${name} yet`);
  CL.people[p.id]=p;
  if(CL.friends.includes(p.id)) return toast(`You're already friends with @${name}`);
  if(CL.incoming.includes(p.id)) return acceptFriend(p.id);
  if(CL.outgoing.includes(p.id)) return toast(`You already sent @${name} a request`);
  const {error:e2}=await sb.from('friendships').insert({requester:uid(),addressee:p.id});
  if(e2) return toast(/duplicate/i.test(e2.message||'')?`You and @${name} already have a request open`:friendlyErr(e2));
  CL.outgoing.push(p.id); UI.addFriend=''; route(); toast(`Friend request sent to @${name}`);
}
async function acceptFriend(id){ const {error}=await sb.from('friendships').update({status:'accepted'}).eq('requester',id).eq('addressee',uid()); if(error) return toast(friendlyErr(error));
  CL.incoming=CL.incoming.filter(x=>x!==id); CL.friends.push(id); route(); toast(`You and ${pname(id)} are now friends`); cloudLoad(true); }
async function dropFriend(id,msg){ const me=uid(); const {error}=await sb.from('friendships').delete().or(`and(requester.eq.${me},addressee.eq.${id}),and(requester.eq.${id},addressee.eq.${me})`); if(error) return toast(friendlyErr(error));
  CL.incoming=CL.incoming.filter(x=>x!==id); CL.outgoing=CL.outgoing.filter(x=>x!==id); CL.friends=CL.friends.filter(x=>x!==id); route(); toast(msg); }
async function createCloudChallenge(c){
  const rule={}; ['wid','moves','lv','fmt'].forEach(k=>{ if(c[k]!=null) rule[k]=c[k]; });
  const {data,error}=await sb.from('challenges').insert({owner:uid(),name:c.name,metric:c.metric,rule,target:c.target||null,days:contestDays(c).len,start_date:c.start,stake:c.stake||null}).select('id,owner,name,metric,rule,target,days,start_date,stake,created_at').single();

async function joinCloud(id){ const c=CL.chals.find(x=>x.id===id); if(!c) return;
  const {error}=await sb.from('challenge_members').insert({challenge_id:id,user_id:uid(),score:0}); if(error) return toast(friendlyErr(error));
  c.joined=true; c.members.push({id:uid(),score:0}); syncScores(); postActivity(`Joined the ${c.name} challenge`,null,'challenge'); route(); toast(`You're in. Good luck in ${c.name}!`); cloudLoad(true); }
async function leaveCloud(id){ const c=CL.chals.find(x=>x.id===id); if(!c) return; const me=uid();
  const alone=c.owner===me && c.members.every(m=>m.id===me);
  const q= alone? sb.from('challenges').delete().eq('id',id) : sb.from('challenge_members').delete().eq('challenge_id',id).eq('user_id',me);
  const {error}=await q; if(error) return toast(friendlyErr(error));
  if(alone) CL.chals=CL.chals.filter(x=>x.id!==id); else { c.joined=false; c.members=c.members.filter(m=>m.id!==me); }
  route(); toast(alone?'Challenge deleted':'You left the challenge'); }

const T={steps:[],i:0,left:0,running:false,last:0,wid:null,title:'',elapsed:0,rounds:0,done:false,iv:null,beepAt:null,amrapIdx:0};
let AC=null;
function beep(f,d){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=f; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
function loadTimer(steps,wid,title){ stopTimer(); Object.assign(T,{prog:null,wobj:null,steps,i:0,left:steps[0].secs,wid,title,elapsed:0,rounds:0,done:false,beepAt:null,amrapIdx:0}); }
function stopTimer(){ T.running=false; clearInterval(T.iv); T.iv=null; }
function startTimer(){ if(T.done||!T.steps.length) return; T.running=true; T.last=performance.now(); clearInterval(T.iv); T.iv=setInterval(tick,200); beep(660,.12); }
function goStep(i){ T.i=i; T.left=T.steps[i].secs; T.beepAt=null; T.amrapIdx=0; renderTimerStage(); }
function tick(){
  const now=performance.now(), dt=(now-T.last)/1000; T.last=now; T.left-=dt; T.elapsed+=dt;
  const sec=Math.ceil(T.left);
  if(sec<=3 && sec>0 && T.beepAt!==sec){ T.beepAt=sec; beep(520,.09); }
  const st=T.steps[T.i];
  if(st.k==='amrap'){ const w=T.wobj||W(T.wid); if(w){ const idx=Math.floor((st.secs-T.left)/8)%w.items.length; if(idx!==T.amrapIdx){ T.amrapIdx=idx; renderTimerStage(); } } }
  if(T.left<=0){ if(T.i<T.steps.length-1){ beep(880,.2); goStep(T.i+1); } else { finish(); return; } }
  updateTimerUI();
}
function finish(){
  stopTimer(); T.done=true; beep(990,.35);
  const min=Math.max(1,Math.round(T.elapsed/60));
  const hw=T.wobj||(T.wid?W(T.wid):null);
  S.history.push({d:iso(TODAY),id:T.wid||0,min,name:T.title,lv:hw?hw.lv:0,fmt:hw?hw.fmt:'custom',bw:!!(hw&&hw.bw),moves:hw?hw.items.map(i=>i.ex):[T.steps[0]&&T.steps[0].ex].filter(Boolean),secs:Math.round(T.elapsed),rounds:T.rounds||0});
  if(T.prog && S.enrolled[T.prog.pid] && !S.enrolled[T.prog.pid].done.includes(T.prog.k)) S.enrolled[T.prog.pid].done.push(T.prog.k);
  S.feed.unshift({t:Date.now(),txt:`You finished ${T.title} (${min} min)`});
  const done=S.history.filter(h=>!h.sample).length;
  const askReview = done>=3 && !S.reviewAsked;
  if(askReview) S.reviewAsked=true;
  save(); route(); toast('Session logged. Your streak and challenges are updated.');
  if(signedIn()){ postActivity(`Finished ${T.title}`,min,'workout'); syncScores(); }
  if(askReview) setTimeout(()=>{ try{ const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.InAppReview; if(P&&P.requestReview) P.requestReview().catch(()=>{}); }catch(e){} },1800);
}

function renderTimerStage(){
  const box=$('#tstage'); if(!box) return;
  const st=T.steps[T.i]; const w=T.wobj||(T.wid?W(T.wid):null);
  if(T.done){ box.innerHTML=`<h2>Session complete</h2><p class="muted" style="margin-top:6px">${Math.max(1,Math.round(T.elapsed/60))} minutes logged. Streak: ${streak()} days.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-act="shareworkout">Share your workout</button><button class="btn" data-act="nav" data-v="progress">See your progress</button><button class="btn ghost" data-act="treset">Do it again</button></div>`; renderSteps(); return; }
  let exId=st.ex, head='', sub='';
  if(st.k==='amrap' && w){ exId=w.items[T.amrapIdx].ex; head=st.label; sub=`Rounds logged: <b class="num" id="trounds">${T.rounds}</b>`; }

  else { head=esc(st.label); sub=esc(st.target||'')+(st.round?` · ${w&&w.fmt==='emom'?'minute':w&&w.fmt==='ladder'?'rung':'round'} ${st.round}`:''); }

  box.innerHTML=`<div class="tstage"><div class="stage">${pic(exId)}</div>
    <div><div class="lbl">${st.k==='rest'?'Rest':st.k==='ready'?'Starting':'Now'}</div><h2 style="margin-top:4px">${head}</h2><p style="margin-top:6px">${sub}</p>
    ${st.k==='amrap'&&w?`<ul class="small" style="margin:8px 0 0;padding-left:18px">${w.items.map((it,i)=>`<li ${i===T.amrapIdx?'style="font-weight:600"':''}>${esc(EXM[it.ex].name)}: ${rxText(EXM[it.ex],it,w)}</li>`).join('')}</ul><button class="btn sm pri" data-act="tround" style="margin-top:10px">+1 round</button>`

    </div></div>`;
  mountAll(box); renderSteps();
}
function renderSteps(){
  const box=$('#tsteps'); if(!box) return;
  box.innerHTML=T.steps.map((s,i)=>`<div class="${i<T.i||T.done?'done':''} ${i===T.i&&!T.done?'cur':''}"><span class="num muted">${i+1}</span><span>${s.k==='rest'?esc(s.label):s.k==='ready'?'Get ready':esc(s.label)+(s.target?' · '+esc(s.target):'')}</span><span class="num">${mmss(s.secs)}</span></div>`).join('');

function updateTimerUI(){
  const d=$('#tdig'); if(!d) return;

/* ---------- Progress ---------- */
function weeksBack(n){ const m=monday(TODAY); return [...Array(n)].map((_,i)=>addDays(m,-7*(n-1-i))); }
function longestStreak(){ const days=[...new Set(S.history.map(h=>h.d))].sort(); let best=0,cur=0,prev=null; days.forEach(d=>{ cur=(prev && iso(addDays(fromIso(prev),1))===d)?cur+1:1; best=Math.max(best,cur); prev=d; }); return best; }
function mmssLong(sec){ sec=Math.round(sec||0); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function weeklyChart(){
  const wks=weeksBack(12); const vals=wks.map(w=>sessionsBetween(iso(w),iso(addDays(w,6))).length);
  const max=Math.max(S.prefs.goal,...vals,1); const top=Math.ceil(max/2)*2;
  const W0=420,H0=190,pl=24,pr=6,pt=14,pb=24, cw=(W0-pl-pr)/12, bw=Math.min(28,cw*0.6), y=v=>pt+(H0-pt-pb)*(1-v/top);
  let g=''; for(let v=0;v<=top;v+=top/2){ g+=`<line class="gl" x1="${pl}" x2="${W0-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const goalY=y(S.prefs.goal);
  g+=`<line x1="${pl}" x2="${W0-pr}" y1="${goalY}" y2="${goalY}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  wks.forEach((w,i)=>{ const x=pl+cw*i+(cw-bw)/2, v=vals[i], h=(H0-pt-pb)*(v/top), lab=w.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    if(v>0) g+=`<rect class="hit" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H0-pt-pb}" tabindex="0" data-tip="Week of ${lab}: ${v} workout${v===1?'':'s'}"/><path class="bar" d="M${x},${y(0)} V${y(v)+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${y(0)} Z"/>`;
    else g+=`<rect class="hit" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H0-pt-pb}" tabindex="0" data-tip="Week of ${lab}: no workouts"/>`;
    if(i%3===0||i===11) g+=`<text class="ax" x="${pl+cw*i+cw/2}" y="${H0-8}" text-anchor="middle">${i===11?'This week':lab}</text>`;
    if(i===11 && v>0) g+=`<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:600">${v}</text>`; });
  return `<div class="chart" role="img" aria-label="Workouts per week for the last 12 weeks"><svg viewBox="0 0 ${W0} ${H0}">${g}</svg><div class="tip"></div></div>`;
}
function heatmap(){
  const wks=weeksBack(12); const byDay={}; S.history.forEach(h=>{ byDay[h.d]=(byDay[h.d]||0)+h.min; });
  const lvl=m=>!m?'':m<15?'l1':m<30?'l2':m<45?'l3':'l4';
  let cells=''; const days=['Mon','','Wed','','Fri','','Sun'];
  for(let r=0;r<7;r++){ cells+=`<span>${days[r]}</span>`; wks.forEach(w=>{ const d=addDays(w,r); const k=iso(d); const m=byDay[k]||0; const fut=d>TODAY;
    cells+=`<i class="${fut?'fut':lvl(m)}" tabindex="${fut?-1:0}" data-tip="${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}: ${m?m+' min':'rest day'}"></i>`; }); }
  return `<div class="chart"><div class="heat" style="--cols:12">${cells}</div><div class="tip"></div>
    <div class="hlegend">Less <i style="background:var(--surface-2);border:1px solid var(--line)"></i><i class="l1" style="background:color-mix(in oklab,var(--accent) 30%,var(--surface))"></i><i style="background:color-mix(in oklab,var(--accent) 55%,var(--surface))"></i><i style="background:color-mix(in oklab,var(--accent) 80%,var(--surface))"></i><i style="background:var(--accent)"></i> More minutes</div></div>`;
}
function muscleBars(){

  S.history.filter(h=>h.d>=since).forEach(h=>{ const mv=h.moves||(W(h.id)?W(h.id).items.map(i=>i.ex):[]); const seen=new Set(); mv.forEach(ex=>{ const e=EXM[ex]; if(e) e.prim.forEach(m=>seen.add(m)); }); seen.forEach(m=>cnt[m]=(cnt[m]||0)+1); });
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10); if(!rows.length) return '<div class="empty">Finish a workout to see which muscles you have trained.</div>';

      <label class="f" style="max-width:220px">Delivery day each month<select data-m="day" id="m-day">${opt([...Array(28)].map((_,i)=>[i+1,'Day '+(i+1)]),m.day)}</select></label>
      <p class="small">Next box arrives <b>${fmtDate(nd)}</b>: ${o.count} chef-prepped meals, packed cold in insulated boxes.</p>
      <table class="sumtbl"><tbody>
        ${o.lines.slice(0,6).map(l=>`<tr><td>${esc(l.name)} × ${l.qty}</td><td>${money(l.amt)}</td></tr>`).join('')}
        ${o.lines.length>6?`<tr><td class="muted">+ ${o.lines.length-6} more meals</td><td>${money(o.lines.slice(6).reduce((a,l)=>a+l.amt,0))}</td></tr>`:''}
        <tr><td>Subtotal (${o.count} meals)</td><td>${money(o.sub)}</td></tr>
        <tr><td>Monthly subscriber discount (10%)</td><td>−${money(o.disc)}</td></tr>
        <tr><td>Delivery</td><td>Included</td></tr>
        <tr class="tot"><td>Monthly total</td><td>${money(o.total)}</td></tr>
      </tbody></table>
      <button class="btn pri" data-act="morder" ${o.count?'':'disabled'}>${m.order?'Update monthly order':'Place demo order'}</button>
      ${m.order?`<div class="note"><b>Order saved</b><span>Demo order for ${fmtDate(fromIso(m.order.next))}. In the live app this is sent to your kitchen partner and billed through your payment provider.</span></div>`:''}
    </div>
    <div class="panel stack">
      <span class="lbl">What the app sends to the kitchen partner</span>
      <p class="small muted">A preview of the order your app would pass to the meal production and delivery partner's API each month.</p>
      <pre class="payload" id="payload">${esc(JSON.stringify(payload,null,2))}</pre>
      <button class="btn sm" data-act="copy" data-text="${esc(JSON.stringify(payload))}">Copy order JSON</button>
    </div>
  </div>`;
}

/* ---------- update check ---------- */
// Checks the store for a newer BellForge on launch and when the app comes back to the foreground (at most every 6 hours).
async function checkForUpdate(force){
  const Cap=window.Capacitor; const AU=Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()&&Cap.Plugins&&Cap.Plugins.AppUpdate; if(!AU) return;
  const now=Date.now(); if(!force && S.lastUpdateCheck && now-S.lastUpdateCheck<6*36e5) return;
  S.lastUpdateCheck=now; save();
  try{
    const info=await AU.getAppUpdateInfo();
    if(info && info.updateAvailability===2){ // UPDATE_AVAILABLE
      if($('#updbar')) return;
      const d=document.createElement('div'); d.className='upd'; d.id='updbar'; d.setAttribute('role','status');
      d.innerHTML=`<span><b>New version available</b>${info.availableVersionName?' ('+esc(info.availableVersionName)+')':''}. Update for the latest workouts and fixes.</span><button class="btn sm pri" data-act="doupdate">Update now</button><button class="btn ghost sm" data-act="laterupdate" aria-label="Remind me later">Later</button>`;
      document.body.appendChild(d); UI.updInfo=info;
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkForUpdate(false); });

/* ---------- sharing ---------- */
const STORE_URL='https://play.google.com/store/apps/details?id=com.quants.bellforge';
async function shareText(text,title,onDone){
  const full=text+' '+STORE_URL+' (Android; iPhone coming soon)';
  try{
    const Cap=window.Capacitor; const Sh=Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()&&Cap.Plugins&&Cap.Plugins.Share;
    if(Sh){ await Sh.share({title,text:text+' ',url:STORE_URL,dialogTitle:title}); onDone&&onDone(); return; }
    if(navigator.share){ await navigator.share({title,text:full}); onDone&&onDone(); return; }
  }catch(e){ if(e&&(e.name==='AbortError'||/cancel/i.test(e.message||''))) return; }
  try{ await navigator.clipboard.writeText(full); toast('Invite message copied. Paste it into a text or post.'); onDone&&onDone(); }catch(e){ toast('Sharing is not available here.'); }
}

/* ---------- events ---------- */
const ACT={
  nav:b=>{ location.hash=b.dataset.v; },
  open:b=>{ location.hash='w-'+b.dataset.id; },
  back:()=>{ const m=location.hash.match(/^#w-(\d+)/); if(m && W(+m[1])) UI.filters.mode=W(+m[1]).bw?'bw':'kb'; location.hash='workouts'; },
  lvpref:b=>{ S.prefs.level=+b.dataset.l; save(); route(); },
  flv:b=>{ UI.filters.lv=+b.dataset.l; UI.filters.limit=24; document.querySelectorAll('[data-act="flv"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderList(); },
  fsaved:b=>{ UI.filters.saved=!UI.filters.saved; b.setAttribute('aria-pressed',UI.filters.saved); renderList(); },
  fmode:b=>{ UI.filters={...UI.filters,mode:b.dataset.m,fmt:'',equip:'',limit:24}; route(); },
  more:()=>{ UI.filters.limit+=24; renderList(); },
  save:b=>{ const id=+b.dataset.id; const i=S.saved.indexOf(id); if(i>=0){ S.saved.splice(i,1); toast('Removed from offline library'); } else { S.saved.push(id); toast('Saved. Available offline in the app.'); } save();
    const on=S.saved.includes(id); b.setAttribute('aria-pressed',on); b.textContent= b.closest('.wcard')?(on?'Saved':'Save offline'):(on?'Saved for offline':'Save for offline');
    const fb=document.querySelector('[data-act="fsaved"]'); if(fb) fb.textContent=`Saved offline (${S.saved.length})`; },
  start:b=>{ const w0=W(+b.dataset.id); const {w,swapped}=withSwaps(w0); loadTimer(w===w0?w.steps:buildSteps(w),w0.id,w0.name); T.wobj=w; if(swapped.length) toast('No pull-up bar: swapped '+swapped.join(', ')); if(location.hash==='#timer') route(); else location.hash='timer'; },
  challenge:b=>{ const w=W(+b.dataset.id); UI.contestDraft={name:(w.name+' Showdown').slice(0,40),metric:'workout',days:7,wid:w.id,stake:''}; location.hash='friends'; },
  ttoggle:()=>{ if(T.done) return; if(T.running) stopTimer(); else startTimer(); updateTimerUI(); },
  tskip:()=>{ if(T.done) return; if(T.i<T.steps.length-1){ goStep(T.i+1); updateTimerUI(); } else finish(); },
  tback:()=>{ if(T.done) return; goStep(Math.max(0,T.i-1)); updateTimerUI(); },
  treset:()=>{ const pg=T.prog, wo=T.wobj; loadTimer(T.steps,T.wid,T.title); T.prog=pg; T.wobj=wo; route(); },
  tfinish:()=>{ if(!T.done && T.elapsed>5) finish(); else toast('Start the session first.'); },
  tclear:()=>{ stopTimer(); T.steps=[]; route(); },
  tround:()=>{ T.rounds++; const r=$('#trounds'); if(r) r.textContent=T.rounds; beep(740,.08); },
  copy:b=>copyText(b.dataset.text),
  su:b=>{ const k=b.dataset.k, v=b.dataset.v; const n=$('#su-name'); if(n) UI.setup.name=n.value; UI.setup[k]= k==='bell'? v==='1' : +v; route(); },
  doupdate:async()=>{ const AU=window.Capacitor.Plugins.AppUpdate; const i=UI.updInfo||{};
    try{ if(i.immediateUpdateAllowed) await AU.performImmediateUpdate(); else await AU.openAppStore(); }catch(e){ try{ await AU.openAppStore(); }catch(_){} } },
  laterupdate:()=>{ const b=$('#updbar'); if(b) b.remove(); },
  hasbell:()=>{ S.prefs.hasBell=true; save(); route(); toast('Kettlebell workouts are back on your Today screen'); },
  invite:b=>{ const c=b.dataset.c; const me=signedIn()?` Add me: @${CL.profile.username}.`:''; shareText(`${c?`Join my "${c}" challenge on BellForge!`:"I'm training with BellForge: kettlebell workouts with muscle maps, classic workouts and challenges."}${me} Get it here:`,'Invite friends to BellForge',()=>{ S.invites=(S.invites||0)+1; S.feed.unshift({t:Date.now(),txt:'You shared an invite'}); save(); route(); }); },
  shareworkout:()=>{ const h=S.history[S.history.length-1]; if(!h) return; shareText(`I just finished ${h.name||'a workout'} on BellForge${h.rounds?`: ${h.rounds} rounds`:h.secs?` in ${mmssLong(h.secs)}`:''}. ${streak()>1?`${streak()}-day streak. `:''}${signedIn()?`Add me: @${CL.profile.username}. `:''}Train with me:`,'Share your workout'); },
  setupsignin:()=>{ UI.setupSignin=true; UI.authErr=''; route(); },
  setupback:()=>{ UI.setupSignin=false; UI.authErr=''; route(); },
  authmode:b=>{ UI.authMode=b.dataset.m; UI.authErr=''; route(); },
  refresh:()=>cloudLoad(true),
  faccept:b=>acceptFriend(b.dataset.id),
  fdecline:b=>dropFriend(b.dataset.id,'Request declined'),
  fcancel:b=>dropFriend(b.dataset.id,'Request cancelled'),
  fremove:b=>{ if(UI.confirmRemove===b.dataset.id){ UI.confirmRemove=null; dropFriend(b.dataset.id,'Friend removed'); } else { UI.confirmRemove=b.dataset.id; b.textContent='Tap to confirm'; } },
  cjoin:b=>joinCloud(b.dataset.id),
  cleave:b=>leaveCloud(b.dataset.id),
  signout:async()=>{ try{ await doBackup(); await sb.auth.signOut(); }catch(e){} Object.assign(CL,{user:null,profile:null,friends:[],incoming:[],outgoing:[],acts:[],chals:[],loaded:false}); route(); toast('Signed out. Your workouts stay on this phone.'); },
  delacct:()=>{ UI.confirmDelete=true; route(); },
  delcancel:()=>{ UI.confirmDelete=false; route(); },
  delacct2:async()=>{ const {error}=await sb.rpc('delete_my_account'); if(error) return toast(friendlyErr(error));
    try{ await sb.auth.signOut({scope:'local'}); }catch(e){} Object.assign(CL,{user:null,profile:null,friends:[],incoming:[],outgoing:[],acts:[],chals:[],loaded:false}); delete S.restoredFor; delete S.lastBackup; UI.confirmDelete=false; save(); route(); toast('Your account was deleted. Workouts on this phone are still here.'); },
  cquit:b=>{ S.contests=S.contests.filter(c=>c.id!==b.dataset.id); save(); route(); toast('Challenge removed'); },
  tcat:b=>{ UI.tcat=b.dataset.c; route(); const el=document.querySelector('.tgrid'); if(el) el.closest('.panel').scrollIntoView(); },
  tpl:b=>{ const t=TEMPLATES[+b.dataset.i]; UI.contestDraft={...t,tpl:true,wid:t.wid==='pick'?todaysPick().id:t.wid,stake:''}; route(); const f=$('#cform'); if(f){ f.scrollIntoView({behavior:REDUCE?'auto':'smooth'}); } },
  tplclear:()=>{ UI.contestDraft=null; route(); const f=$('#cform'); if(f) f.scrollIntoView(); },
  penroll:b=>{ S.enrolled[b.dataset.p]={start:iso(TODAY),done:[]}; save(); location.hash='p-'+b.dataset.p; if(location.hash==='#p-'+b.dataset.p) route(); toast('Program started. Your first session is ready.'); },
  pquit:b=>{ delete S.enrolled[b.dataset.p]; save(); route(); },
  pstart:b=>{ const p=PM[b.dataset.p], k=+b.dataset.k; const w0=W(p.sched[k]); const {w,swapped}=withSwaps(w0); loadTimer(w===w0?w.steps:buildSteps(w),w0.id,w0.name); T.wobj=w; if(swapped.length) toast('No pull-up bar: swapped '+swapped.join(', ')); T.prog={pid:p.id,k}; location.hash='timer'; },
  pnext:b=>{ const p=PM[b.dataset.p]; const k=nextSlot(p); if(k<0){ location.hash='p-'+p.id; return; } const w0=W(p.sched[k]); const {w,swapped}=withSwaps(w0); loadTimer(w===w0?w.steps:buildSteps(w),w0.id,w0.name); T.wobj=w; if(swapped.length) toast('No pull-up bar: swapped '+swapped.join(', ')); T.prog={pid:p.id,k}; location.hash='timer'; },
  pchal:b=>{ const p=PM[b.dataset.p]; UI.contestDraft={tpl:true,name:p.name.slice(0,40),desc:`Do the ${p.name} program together. Most program sessions completed wins.`,metric:'sessions',days:p.weeks*7,stake:''}; location.hash='friends'; setTimeout(()=>{ const f=$('#cform'); if(f) f.scrollIntoView(); },50); },
  nudge:b=>{ const id=b.dataset.id; if(!S.nudged.includes(id)){ S.nudged.push(id); S.feed.unshift({t:Date.now(),txt:`You nudged ${friend(id).name}`}); save(); route(); toast(`${friend(id).name} will get a nudge to train today`); } },
  mswap:b=>{ const d=+b.dataset.d, si=+b.dataset.s; const slot=SLOTS[S.meal.mpd][si]; const el=eligible(slot); const cur=el.findIndex(x=>x.id===S.meal.plan[d][si]); S.meal.plan[d][si]=el[(cur+1)%el.length].id; save(); route(); },
  mregen:()=>{ const slots=SLOTS[S.meal.mpd]; S.meal.plan=DAYS.map(()=>slots.map(s=>{ const el=eligible(s); return el.length?el[Math.floor(Math.random()*el.length)].id:null; })); save(); route(); },
  morder:()=>{ const o=orderLines(); S.meal.order={next:iso(nextDelivery(S.meal.day)),count:o.count,total:o.total}; save(); route(); toast('Demo order saved'); },
  reset:()=>{ try{ localStorage.removeItem(KEY); }catch(e){} S=seedState(); stopTimer(); T.steps=[]; UI.lastInvite=null; UI.contestDraft=null; route(); toast('App data reset'); }
};
document.addEventListener('click',e=>{ const a=e.target.closest('a[href^="http"]'); const Cap=window.Capacitor;
  if(a && Cap && Cap.isNativePlatform && Cap.isNativePlatform()){ e.preventDefault(); const Br=Cap.Plugins&&Cap.Plugins.Browser; if(Br) Br.open({url:a.href}); else window.open(a.href,'_system'); return; } },true);
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b,e); } });
document.addEventListener('input',e=>{ if(e.target.id==='wq'){ UI.filters.q=e.target.value; UI.filters.limit=24; renderList(); } });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pref){ S.prefs[t.dataset.pref]=t.checked; save(); route(); toast(t.checked?'Pull-ups unlocked':'Pull-ups will be swapped for table rows'); return; }
  if(t.dataset.ch==='goal'){ S.prefs.goal=+t.value; save(); route(); return; }
  if(t.dataset.ch){ UI.filters[t.dataset.ch]=t.value; UI.filters.limit=24; renderList(); return; }
  if(t.dataset.m){ const k=t.dataset.m; const num=['age','lbs','ft','inch','act','mpd','day'].includes(k); let v=num?+t.value:t.value; if(num && !isFinite(v)) return;
    S.meal[k]=v; if(['diet','mpd'].includes(k)) genPlan(); save(); route(); return; }
  if(t.dataset.al){ const a=t.dataset.al; const L=S.meal.allergens; const i=L.indexOf(a); if(t.checked&&i<0) L.push(a); if(!t.checked&&i>=0) L.splice(i,1); genPlan(); save(); route(); return; }
  if(t.dataset.dl){ S.meal.deliver[t.dataset.dl]=t.checked; save(); route(); return; }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  if(f==='custom'){ const ex=$('#cx-ex').value, w=Math.max(5,+$('#cx-w').value||40), r=Math.max(0,+$('#cx-r').value||0), n=Math.min(50,Math.max(1,+$('#cx-n').value||8));
    const steps=[{k:'ready',secs:10,label:'Get ready',ex}]; for(let i=1;i<=n;i++){ steps.push({k:'work',ex,secs:w,label:EXM[ex].name,target:w+'s work',round:i}); if(i<n && r) steps.push({k:'rest',secs:r,label:'Rest',ex}); }
    loadTimer(steps,null,`Custom: ${EXM[ex].name}`); route(); }
  if(f==='contest'){ const name=$('#cn').value.trim(); if(!name) return; const D=UI.contestDraft||{};
    let c;
    const members=[{id:'me'}];
    const code=Math.random().toString(36).slice(2,10).toUpperCase();
    if(D.tpl){ c={id:'c'+Date.now(),name,metric:D.metric,start:iso(TODAY),end:iso(addDays(TODAY,D.days-1)),members,stake:$('#cs').value.trim(),code};
      ['target','moves','lv','fmt','wid'].forEach(k=>{ if(D[k]!=null) c[k]=D[k]; }); }
    else { const days=+$('#cd').value, metric=$('#cm').value, tg=+$('#ct').value;
      c={id:'c'+Date.now(),name,metric,start:iso(TODAY),end:iso(addDays(TODAY,days-1)),members,stake:$('#cs').value.trim(),code};
      if(tg>0) c.target=tg; if(metric==='workout' && D.wid) c.wid=D.wid; }
    S.feed.unshift({t:Date.now(),txt:`You started ${name}`}); UI.contestDraft=null; UI.lastInvite=null;
    if(signedIn()){ createCloudChallenge(c).then(()=>{ save(); route(); toast('Challenge started. Your friends can join it now.'); }).catch(err=>{ S.contests.unshift(c); save(); route(); toast(friendlyErr(err)+' Saved on this phone instead.'); }); return; }
    S.contests.unshift(c); save(); route(); toast('Challenge started. Create an account so friends can join you.'); }
  if(f==='auth'){ doAuth(e.target.dataset.mode); return; }
  if(f==='addfriend'){ const v=$('#af').value; UI.addFriend=v; addFriend(v); return; }
  if(f==='username'){ const u=$('#un').value.trim().replace(/^@/,'').toLowerCase(); if(!/^[a-z0-9_]{3,20}$/.test(u)){ toast('Usernames are 3–20 characters: lowercase letters, numbers and _'); return; }
    sb.from('profiles').insert({id:uid(),username:u,display_name:((S.profile&&S.profile.name)||u).slice(0,30),level:S.prefs.level||1}).then(({error})=>{ if(error) return toast(friendlyErr(error)); S.restoredFor=uid(); save(); cloudLoad(true); toast(`You're @${u}`); }); return; }
  if(f==='setup'){ const name=$('#su-name').value.trim(); if(!name){ $('#su-name').focus(); return; } const U=UI.setup;
    S.profile={name,created:iso(TODAY)}; S.prefs.level=U.level; S.prefs.goal=U.goal; S.prefs.hasBell=U.bell; if(!U.bell) UI.filters.mode='bw';
    save(); location.hash='today'; route(); toast('All set, '+name+'. Let\'s train.'); }
  if(f==='profile'){ const n=$('#pf-name').value.trim(); if(n) S.profile.name=n; S.prefs.level=+$('#pf-level').value; S.prefs.goal=+$('#pf-goal').value; S.prefs.hasBell=$('#pf-bell').value==='1'; save(); route(); toast('Settings saved');
    if(signedIn()){ const upd={display_name:S.profile.name.slice(0,30),level:S.prefs.level}; Object.assign(CL.profile,upd); sb.from('profiles').update(upd).eq('id',uid()).then(()=>{}); } }
  if(f==='friend'){ const v=$('#fa').value.trim(); if(!v) return; S.friends.push({id:'u'+Date.now(),name:v.includes('@')?v.split('@')[0]:v,streak:0,mpd:8,spw:3,last:'–',status:'pending'}); save(); route(); toast(`Friend request ready for ${v}`); }
});

route();
checkForUpdate(true);
cloudInit();
})();
